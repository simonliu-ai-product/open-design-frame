name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  # The viewer ships as source, so what matters is whether the tarball works —
  # not whether the monorepo does.
  packaged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @open-design-frame/core build
      # pnpm, not npm: npm does not read pnpm's workspaces, and only pnpm
      # rewrites `workspace:*` into a real version on the way out.
      - run: cd packages/core && pnpm pack --pack-destination /tmp
      - name: Build a frame from the packed package
        run: |
          mkdir -p /tmp/try/frames/hello && cd /tmp/try
          echo '{ "name": "try", "private": true, "type": "module" }' > package.json
          cat > frames/hello/index.tsx <<'EOF'
          import { type Frame, Layer, SIZES } from '@open-design-frame/core';
          const Hello: Frame = () => <Layer name="Page">It installs.</Layer>;
          Hello.size = SIZES.DESKTOP;
          export default [Hello];
          EOF
          npm install --silent /tmp/open-design-frame-core-*.tgz
          npx open-design-frame build
          test -f dist/index.html

      # `build` goes through Rollup and never asks Vite's dependency optimizer
      # anything, so it cannot see the one thing that only breaks once the
      # viewer's source is inside node_modules. Opening the dev server can.
      - name: Serve that frame and check the viewer mounts
        run: |
          cd /tmp/try
          npx open-design-frame dev > /tmp/dev.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:5274/ && break
            sleep 1
          done
          google-chrome --headless=new --disable-gpu --no-sandbox \
            --remote-debugging-port=9222 --user-data-dir=/tmp/chrome-profile \
            about:blank > /dev/null 2>&1 &
          node "$GITHUB_WORKSPACE/.github/scripts/dev-smoke.mjs" http://localhost:5274/ 9222

      - name: The dev server's log, if that failed
        if: failure()
        run: cat /tmp/dev.log
